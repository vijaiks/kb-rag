[project]
name = "kb-rag"
version = "0.1.0"
description = "Local-first RAG over a personal telecom/cloud knowledge base, with hybrid retrieval and an MCP assistant"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.11",              # CUDA-enabled aarch64 wheel comes from PyPI since 2.11
    "docling>=2.0",
    "pypdf>=5.0",
    "sentence-transformers>=3.0",
    "FlagEmbedding>=1.3",
    "lancedb>=0.15",
    "pyarrow>=17",
    "anthropic>=0.40",
    "pyyaml",
    "tqdm",
    "rich",
    "mcp>=1.2",
]

[project.optional-dependencies]
eval = ["ragas>=0.2"]
ui = ["streamlit>=1.40"]
dev = ["pytest", "ruff"]

[project.scripts]
kb = "app.cli:main"

[tool.uv]
# If `uv sync` ever resolves a CPU-only torch, uncomment the two blocks below
# to pin the PyTorch CUDA 13 index (match it to the CUDA version nvidia-smi shows).
# [[tool.uv.index]]
# name = "pytorch-cu130"
# url = "https://download.pytorch.org/whl/cu130"
# explicit = true
# [tool.uv.sources]
# torch = { index = "pytorch-cu130" }

[tool.setuptools]
packages = ["ingest", "query", "llm", "app", "agents", "mcp_server"]
py-modules = ["common"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
