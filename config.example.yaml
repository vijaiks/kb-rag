# kb-rag configuration TEMPLATE.
# Copy to config.yaml (gitignored) and edit the paths for your machine:
#   cp config.example.yaml config.yaml
source_dir: ~/documents/KnowledgeBase      # folder with your PDFs (on WSL: /mnt/c/Users/<you>/...)
catalog_csv: ~/documents/KnowledgeBase/_kb_catalog.csv   # optional; delete the line to index every file
data_dir: ~/kb-rag-data                    # vector DB, manifest, caches; keep OUT of cloud-sync folders
exclude_names: ["desktop.ini", "_cleanup_log.csv", "_kb_catalog.csv"]

phase0_folders: []                         # [] = all folders; or e.g. ["5G-NR", "5gPHY"] to start small

parsing:
  engine: docling
  ocr: true
  vision_captions: false

chunking:
  target_tokens: 500
  overlap_tokens: 50
  keep_tables_whole: true

embedding:
  model: BAAI/bge-m3
  device: cuda                             # or cpu
  batch_size: 32
  dim: 1024

retrieval:
  top_k_candidates: 40
  top_k_final: 8
  max_per_file: 3
  hybrid: true
  reranker: BAAI/bge-reranker-v2-m3

llm:
  provider: anthropic
  model: claude-opus-5-5
  max_tokens: 2000
