<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>kb-rag chat</title>
<style>
:root{--bg:#faf9f5;--fg:#1f1e1d;--mut:#6b6a68;--card:#fff;--line:#e5e3dc;--acc:#c96442}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--fg:#eceae4;--mut:#9b9a96;--card:#30302e;--line:#42413e;--acc:#d97757}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{margin-right:auto}select,input,button,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
button{cursor:pointer}label{color:var(--mut);font-size:14px}
#log{flex:1;overflow:auto;padding:16px;max-width:820px;width:100%;margin:0 auto}
.msg{margin:0 0 18px}.user{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;white-space:pre-wrap;margin-left:auto;width:fit-content;max-width:90%}
.bot{white-space:pre-wrap;word-wrap:break-word}.bot pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;white-space:pre}
.bot code{background:var(--card);padding:1px 4px;border-radius:4px}.bot pre code{padding:0;background:none}
.src{margin-top:8px;font-size:13px;color:var(--mut)}.src summary{cursor:pointer}.src div{margin:4px 0}.err{color:#c00}
form{display:flex;gap:8px;padding:12px 16px;max-width:820px;width:100%;margin:0 auto}
textarea{flex:1;resize:none;height:52px}#send{background:var(--acc);color:#fff;border:0;padding:0 18px}
</style></head><body>
<header><b>kb-rag</b>
<label>mode <select id="mode"><option value="kb">KB only</option><option value="assistant">Assistant</option></select></label>
<label>tech <input id="tech" size="6" placeholder="NR"></label>
<label><input type="checkbox" id="fast"> fast</label>
<button id="new">New chat</button></header>
<div id="log"></div>
<form id="f"><textarea id="q" placeholder="Ask your knowledge base... (Enter to send, Shift+Enter for newline)" autofocus></textarea><button id="send">Send</button></form>
<script>
const $=id=>document.getElementById(id),log=$('log');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){ // minimal safe renderer: escape first, then code fences, inline code, bold
  const parts=esc(t).split('```');
  return parts.map((p,i)=>i%2?'<pre><code>'+p.replace(/^[^\n]*\n/,'')+'</code></pre>'
    :p.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')).join('');
}
function add(cls){const d=document.createElement('div');d.className='msg '+cls;log.appendChild(d);return d}
let busy=false;
async function send(){
  const msg=$('q').value.trim();if(!msg||busy)return;busy=true;$('q').value='';
  add('user').textContent=msg;const bot=add('bot'),body=document.createElement('div');bot.appendChild(body);
  let text='',sources=[];
  try{
    const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:msg,mode:$('mode').value,tech:$('tech').value.trim(),fast:$('fast').checked})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
    for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf('\n\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+2);
        if(!line.startsWith('data: '))continue;const ev=JSON.parse(line.slice(6));
        if(ev.type==='token'){text+=ev.text;body.innerHTML=md(text)}
        else if(ev.type==='sources')sources=ev.sources;
        else if(ev.type==='error'){const e=document.createElement('div');e.className='err';e.textContent='Error: '+ev.text;bot.appendChild(e)}
        log.scrollTop=log.scrollHeight}}
    if(sources.length){const d=document.createElement('details');d.className='src';
      d.innerHTML='<summary>'+sources.length+' sources</summary>'+sources.map(s=>'<div>['+s.tag+'] '+esc(s.file)+' p.'+s.page_start+(s.page_end!==s.page_start?'-'+s.page_end:'')+(s.section?' &middot; '+esc(s.section.slice(0,70)):'')+'</div>').join('');
      bot.appendChild(d)}
  }catch(e){const x=document.createElement('div');x.className='err';x.textContent='Error: '+e.message;bot.appendChild(x)}
  busy=false;log.scrollTop=log.scrollHeight;
}
$('f').onsubmit=e=>{e.preventDefault();send()};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
$('new').onclick=async()=>{await fetch('/reset',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});log.innerHTML=''};
</script></body></html>
